# Molecular and neuroimaging features x work history: configuration.
#
# Thresholds, field IDs and feature rules live here, not in the code. Cohort definition, sex split and
# career types come from the typology config (config.yaml at the repository root) and its outputs; the
# aging module's person / measure tables are read, not modified.
# The brain feature list is not stored here: molecular/ref/brain_features.csv is generated by
# py/build_brain_ref.py (139 FAST grey-matter volumes + 48 TBSS FA tracts).

# ── Paths (relative to the repository root) ─────────────────────────
paths:
  main_file: data/ukb_main_dataset.csv     # UKB main phenotype table (R/m_e1_extract.R)
  withdraw: data/withdraw.csv              # participants who withdrew consent (one eid per line, no header)
  data: data                               # raw UKB tables (Olink long table)
  refs: references                         # published reference files (UKB coding 143, MSigDB GMT files)
  upstream: results/typology               # typology outputs (derived/cohort.parquet, worklife_annual, camsis_by_age)
  aging_derived: results/aging/derived     # aging-module outputs (person_{sex}.parquet, measure.parquet)
  out: results/molecular                   # this module; extracts go to <out>/extract

files:
  olink_long: olink_data.txt               # UKB Olink long table (eid, ins_index, protein_id, result), in paths.data
  coding143: uniprot_meaning               # UKB coding 143, tab-separated: coding, meaning ("GENE;Protein name")
  # Gene sets (gene symbols) used by R/m5_fgsea.R when the msigdbr package is not installed
  gmt: [c5.go.bp.v2024.1.Hs.symbols.gmt, c5.go.cc.v2024.1.Hs.symbols.gmt, c5.go.mf.v2024.1.Hs.symbols.gmt,
        c2.cp.kegg_legacy.v2024.1.Hs.symbols.gmt]

# ── m_e1: extraction from the main table (written to <out>/extract/m_e1_*) ──
extract:
  gate_field: 53            # row gate: field 53 (assessment date) present at gate_instances
  gate_instances: [2]
  chunk_cols: 400
  groups:
    blood_bc:               # LB: all participants, instance 0
      gate: false
      instances: [0]
      fields:
        30000: wbc
        30010: rbc
        30020: hgb
        30030: hct
        30040: mcv
        30050: mch
        30060: mchc
        30070: rdw
        30080: plt
        30090: pct
        30100: mpv
        30110: pdw
        30120: lymph
        30130: mono
        30140: neut
        30150: eos
        30160: baso
        30170: nrbc
        30180: lymph_pct
        30190: mono_pct
        30200: neut_pct
        30210: eos_pct
        30220: baso_pct
        30230: nrbc_pct
        30240: retic_pct
        30250: retic
        30260: mrv
        30270: mscv
        30280: irf
        30290: hlr_pct
        30300: hlr
        30600: albumin
        30610: alp
        30620: alt
        30630: apoa
        30640: apob
        30650: ast
        30660: dbil
        30670: urea
        30680: calcium
        30690: chol
        30700: creatinine
        30710: crp
        30720: cystatin
        30730: ggt
        30740: glucose
        30750: hba1c
        30760: hdl
        30770: igf1
        30780: ldl
        30790: lpa
        30800: oestradiol
        30810: phosphate
        30820: rf
        30830: shbg
        30840: tbil
        30850: testosterone
        30860: tprotein
        30870: tg
        30880: urate
        30890: vitd
        30500: u_alb
        30505: u_alb_flag
        30510: u_creat
        30515: u_creat_flag
        30520: u_k
        30525: u_k_flag
        30530: u_na
        30535: u_na_flag
        74: fasting_time
        3166: draw_time
      # Companion fields of each biochemistry assay = field ID + offset, column {short}_{suffix}
      companions:
        apply_range: [30600, 30890]
        offsets: {5: missing_reason, 6: reportability}
    nmr:                    # LN: every field ukbnmr needs (biomarkers, QC flags, sample processing); all instances
      gate: false           # ukbnmr estimates technical variation over all samples, so no pre-filtering
      instances: all
      # Categories 220 (biomarkers), 222 (sample processing), 221 (QC flags); 20280-20283 = Glucose_Lactate,
      # Corrected_Ala, Processing.Batch, Resolved.Plate.Swaps. Field IDs absent from the table are not
      # counted as missing.
      ranges: [[20280, 20283], [23400, 23660], [23700, 23948]]
      naming: rap           # columns p{field}_i{instance}_a{array}; m_e2 renames them for ukbnmr
      drop_empty_rows: true # keep only participants with at least one NMR value
    olink_meta:             # LP technical covariates
      gate: false
      instances: [0]
      fields: {30900: olink_nprot, 30901: olink_plate}
    brain_extra:            # LI: imaging cohort, instance 2
      gate: true
      instances: [2]
      list: brain_features.csv          # in molecular/ref/ (field, short_name, label, modality)
      fields:
        25781: wmh
        25000: t1_vol_scaling           # head-size scaling
        25734: t1_inv_snr
        25732: t1_discrep_nonlinear
        25741: rfmri_motion             # general head-motion proxy
        25746: dmri_outlier_slices
        25756: scanner_x
        25757: scanner_y
        25758: scanner_z
        25759: scanner_table
    cov_extra:              # ethnic group (instance 0)
      gate: false
      instances: [0]
      fields:
        21000: ethnic

# ── Layers and samples ──────────────────────────────────────────────
samples:
  blood: [full, restricted]     # restricted = career ended before the blood draw (left-work sample)
  brain: [full, cn]             # cn = free of chronic disease at the imaging visit

lb:
  skew_log: 1.0                 # skewness > 1 -> log
  trim_mad: 6                   # after transformation, > 6 x 1.4826 MAD from the median -> missing
  binarise_mode_share: 0.5      # modal value share > 50% (e.g. nrbc) -> binary "> mode"
  detect_markers: [oestradiol, rf]   # analysed only as {name}_detect: value present = 1; not reportable (too low) = 0
  reportability_low: [3]        # UKB coding 4917: 3 = not reportable at assay (too low)
  reportable_ok: [1]            # reportability recorded and not in this list -> value set to missing
  egfr: true                    # CKD-EPI 2021 creatinine + cystatin C
  acr: {lod: 6.7, below_lod_fill: 0.5}   # urine microalbumin < 6.7 mg/L (flag without value) -> LOD x 0.5
  exclude: [u_k, u_na, u_alb, u_creat]   # urine potassium / sodium not analysed; albumin / creatinine enter as ACR
  tech_fields: [fasting_time, draw_time]   # fasting time (74), time of blood draw (3166 -> hour); LB / LN / LP

ln:
  type_keep: Non-derived        # ukbnmr::nmr_info$Type
  expected_n: 107
  trim_mad: 6                   # after log; also used for LP

lp:
  instance: 0
  long_chunk_rows: 5000000
  max_missing_frac: 0.5         # assay missing in > 50% of a sex -> removed

li:
  trim_mad: 6                   # GMV / FA / WMH
  log1p: [wmh]
  tech: [t1_vol_scaling, t1_inv_snr, t1_discrep_nonlinear, rfmri_motion, dmri_outlier_slices,
         scanner_x, scanner_y, scanner_z, scanner_table]
  modalities: [GMV, FA, WMH]

# ── Covariates (aging-module design() plus ethnic group and layer-specific technical covariates) ──
covariates:
  age_knots: 4
  min_level_n: 200
  missing_as_level: true
  design_rank_tol: 1.0e-8
  season: true
  cat_min_level_n: 30           # cat__* (ethnic group, Olink plate): smaller levels pooled into Other

# ── Exposures ───────────────────────────────────────────────────────
exposure:
  axes: [camsis_mean, camsis_slope, camsis_change, exposure_breadth, longest_agent_years,
         n_moves, net_displacement]
  agents: [noisy, cold, hot, dusty, fumes, cigarette, asbestos, paints, pesticides, diesel]
  long_hours_threshold: 48      # hours per week
  per_years: 10                 # exposure-years per 10 years
  grey_min_n: 50                # type or rest < 50, or exposed < 50 -> not tested, not in the FDR family
  x_models: [X2]                # X2 = base + pre-measurement mean CAMSIS
alpha: 0.10                     # BH FDR level (prespecified 0.05, relaxed to 0.10; see Methods)
nominal_p: 0.05                 # nominal threshold for counts of nominal associations

# ── m3b: omnibus tests ──────────────────────────────────────────────
omnibus:
  layers: [LB, LN, LP, LI]
  samples: [full]
  min_features: 5               # modalities with < 5 features (WMH) are not tested jointly
  n_sim: 20000                  # draws for the max|z| null distribution
  seed: 20261008

# ── m5: preranked enrichment ────────────────────────────────────────
enrich:
  min_size: 15
  max_size: 500
  nperm: 10000
  eps: 1.0e-50                  # fgsea default
  analyses: [type]
  seed: 20261008
